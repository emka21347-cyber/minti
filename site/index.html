<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINTI — rebuilding</title>
<meta name="description" content="MINTI is being rebuilt. Open agents. Open weights. Clan-aware.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='7' height='7' fill='%235fd7ff'/%3E%3Crect x='8' y='8' width='7' height='7' fill='%235fd7ff'/%3E%3C/svg%3E">
<style>
:root { --bg:#060606; --mint:#00d787; --cyan:#5fd7ff; --grey:#8a8a8a; --value:#eeeeee; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body {
  background:var(--bg); color:var(--value);
  font-family: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, Menlo, monospace;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
main { max-width:480px; text-align:center; }
.mark { display:inline-block; margin-bottom:28px; }
.mark svg { display:block; }
h1 { color:var(--mint); font-size:18px; letter-spacing:.5em; text-indent:.5em; font-weight:700; margin-bottom:6px; }
.tag { color:var(--grey); font-size:12px; margin-bottom:32px; }
p  { color:var(--value); margin-bottom:14px; }
.dim { color:var(--grey); font-size:12px; }
.rule { color:#1e2a2a; margin:24px 0; user-select:none; }
a { color:var(--cyan); text-decoration:none; }
a:hover { text-decoration:underline; }
</style>
</head>
<body>
<main>
  <span class="mark" aria-hidden="true">
    <svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
      <rect x="4"  y="4"  width="32" height="32" fill="#5fd7ff"/>
      <rect x="36" y="36" width="32" height="32" fill="#5fd7ff"/>
    </svg>
  </span>
  <h1>MINTI</h1>
  <div class="tag">Open agents. Open weights. Clan-aware.</div>
  <p>The workshop is being rebuilt.</p>
  <p class="dim">MINTI is reforming around its strongest idea: a bootable
  desktop OS for old laptops with a resident agent — a user experience that
  evolves through conversation.</p>
  <div class="rule">────────────</div>
  <p class="dim"><a href="https://github.com/emka21347-cyber/minti">github.com/emka21347-cyber/minti</a></p>
</main>
</body>
</html>
