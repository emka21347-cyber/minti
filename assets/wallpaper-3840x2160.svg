<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <style>
      .bg   { fill: #0a0a0a; }
      .edge { stroke: #5fd7ff; stroke-width: 6; stroke-linecap: round; fill: none; }
      .edge-bold { stroke: #5fd7ff; stroke-width: 8; stroke-linecap: round; fill: none; }
      .node { fill: #5fd7ff; }
      .word { font-family: monospace; font-size: 72px; font-weight: bold;
              letter-spacing: 24px; fill: #00d787; }
      .rule { stroke: #8a8a8a; stroke-width: 2; }
      .tag  { fill: #8a8a8a; font-family: monospace; font-size: 38px; }
      /* Subtle background mesh */
      .mesh { stroke: #1a1a1a; stroke-width: 1; fill: none; }
    </style>

    <!-- Background mesh pattern: 120px grid -->
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path class="mesh" d="M120 0 L0 0 0 120"/>
    </pattern>
    <!-- Subtle radial fade so mesh is denser at edges -->
    <radialGradient id="meshFade" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#0a0a0a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect class="bg" width="3840" height="2160"/>

  <!-- Subtle mesh grid -->
  <rect width="3840" height="2160" fill="url(#grid)"/>
  <!-- Vignette over mesh so it fades toward center -->
  <rect width="3840" height="2160" fill="url(#meshFade)"/>

  <!--
    Logo centered at (1920, 980). Scale: ASCII logo is ~200px wide in 320px viewBox.
    Target width ~900px → scale factor ~2.8× from the 320px base.
    We use a group with transform to place it.

    Grid in local coords (same as logo.svg):
      Col x: 80, 160, 240   →  scaled: 224, 448, 672  →  offset to center: +1584
      So absolute x: 1808, 2032, 2256 ... let's recalculate.

    Scale = 4.0 (logo viewBox 320 → ~900px node span)
    Node col x: 80*4=320, 160*4=640, 240*4=960
    Node row y: 60*4=240, 130*4=520, 200*4=800
    Center of grid: x=(320+960)/2=640, y=(240+800)/2=520
    We want center at (1920, 900) → translate(1920-640, 900-520) = translate(1280, 380)
  -->
  <g transform="translate(1280, 380)">
    <!-- Horizontal edges -->
    <line class="edge" x1="320" y1="240" x2="640" y2="240"/>
    <line class="edge" x1="640" y1="240" x2="960" y2="240"/>
    <line class="edge" x1="320" y1="520" x2="640" y2="520"/>
    <line class="edge" x1="640" y1="520" x2="960" y2="520"/>
    <line class="edge" x1="320" y1="800" x2="640" y2="800"/>
    <line class="edge" x1="640" y1="800" x2="960" y2="800"/>

    <!-- Vertical edges -->
    <line class="edge" x1="320" y1="240" x2="320" y2="520"/>
    <line class="edge" x1="320" y1="520" x2="320" y2="800"/>
    <line class="edge" x1="640" y1="240" x2="640" y2="520"/>
    <line class="edge-bold" x1="640" y1="520" x2="640" y2="800"/>
    <line class="edge" x1="960" y1="240" x2="960" y2="520"/>
    <line class="edge" x1="960" y1="520" x2="960" y2="800"/>

    <!-- Diagonal extensions -->
    <line class="edge" x1="320" y1="240" x2="176" y2="96"/>
    <line class="edge" x1="960" y1="240" x2="1104" y2="96"/>
    <line class="edge" x1="320" y1="800" x2="176" y2="944"/>
    <line class="edge" x1="960" y1="800" x2="1104" y2="944"/>

    <!-- Nodes -->
    <circle class="node" cx="320"  cy="240" r="20"/>
    <circle class="node" cx="640"  cy="240" r="20"/>
    <circle class="node" cx="960"  cy="240" r="20"/>
    <circle class="node" cx="320"  cy="520" r="20"/>
    <circle class="node" cx="640"  cy="520" r="20"/>
    <circle class="node" cx="960"  cy="520" r="20"/>
    <circle class="node" cx="320"  cy="800" r="20"/>
    <circle class="node" cx="640"  cy="800" r="20"/>
    <circle class="node" cx="960"  cy="800" r="20"/>
    <!-- Corner extension endpoints -->
    <circle class="node" cx="176"  cy="96"  r="16"/>
    <circle class="node" cx="1104" cy="96"  r="16"/>
    <circle class="node" cx="176"  cy="944" r="16"/>
    <circle class="node" cx="1104" cy="944" r="16"/>
  </g>

  <!-- Wordmark -->
  <text class="word" x="1920" y="1430" text-anchor="middle">M I N T I</text>

  <!-- Rule -->
  <line x1="1620" y1="1460" x2="2220" y2="1460" class="rule"/>

  <!-- Tagline -->
  <text class="tag" x="1920" y="1520" text-anchor="middle">Open agents. Open weights. Clan-aware.</text>
</svg>
