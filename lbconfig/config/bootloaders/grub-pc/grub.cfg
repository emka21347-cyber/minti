# MINTI GRUB2 config — live ISO boot menu
# Managed by live-build; regenerated on lb build.

if loadfont /boot/grub/font.pf2; then
    set gfxmode=auto
    insmod efi_gop
    insmod efi_uga
    insmod gfxterm
    terminal_output gfxterm
fi

if [ -f /boot/grub/themes/minti/theme.txt ]; then
    set theme=/boot/grub/themes/minti/theme.txt
fi

set default=0
set timeout=10
set timeout_style=countdown

# ── menu entries ──────────────────────────────────────────────────────────────

menuentry "MINTI Live" --class minti --class gnu-linux {
    linux   /live/vmlinuz boot=live components quiet splash
    initrd  /live/initrd.img
}

menuentry "MINTI Live (safe graphics)" --class minti {
    linux   /live/vmlinuz boot=live components nomodeset
    initrd  /live/initrd.img
}

menuentry "Install MINTI to disk" --class minti {
    linux   /live/vmlinuz boot=live components quiet splash \
            automatic-ubiquity preseed/file=/cdrom/preseed/minti.cfg
    initrd  /live/initrd.img
}

menuentry "Boot from first hard disk" {
    set root=(hd0)
    chainloader +1
}
